<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>새 게시글 · Moment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="new">
  <main class="page narrow compose">
    <h1>새 게시글</h1>
    <div class="field">
      <label id="upl">사진 (선택, 10MB 이하 · jpg / png / webp)</label>
      <label class="upload" id="drop" aria-labelledby="upl">
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp" class="sr-only">
        <div id="ph">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
          <div><strong>사진 선택</strong></div>
          <div style="font-size:13px">클릭하거나 파일을 끌어다 놓으세요</div>
        </div>
      </label>
      <div class="error" id="e-file" role="alert"></div>
      <div class="progress" id="prog"><i></i></div>
    </div>
    <div class="field">
      <label for="cap">내용</label>
      <textarea class="textarea" id="cap" maxlength="2200" placeholder="무슨 일이 있었나요?"></textarea>
      <div class="hint counter"><span id="cnt">0</span> / 2,200</div>
    </div>
    <div class="error" id="e-form" role="alert"></div>
    <div class="actions-row">
      <a class="btn btn-secondary" href="index.html">취소</a>
      <button class="btn btn-primary" id="submit" disabled>게시</button>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script type="module">
    import { createPost, requireSession, initHeader } from './js/supabase.js';
    const { $, I, toast } = UI;
    const file = $('#file'), drop = $('#drop'), cap = $('#cap'), btn = $('#submit');
    let chosenFile = null, preview = null;

    (async () => { if (!(await requireSession())) return; initHeader(); })();

    const refresh = () => { btn.disabled = !(cap.value.trim() || chosenFile); $('#cnt').textContent = cap.value.length.toLocaleString(); };
    cap.addEventListener('input', refresh);

    function setFile(f) {
      const err = $('#e-file'); err.textContent = '';
      if (!f) return;
      if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { err.textContent = 'jpg, png, webp 형식만 올릴 수 있어요.'; return; }
      if (f.size > 10 * 1024 * 1024) { err.textContent = '10MB 이하의 이미지만 올릴 수 있어요.'; return; }
      clear();
      chosenFile = f;
      preview = URL.createObjectURL(f);
      drop.insertAdjacentHTML('beforeend', `<img src="${preview}" alt="미리보기"><button type="button" class="rm" aria-label="사진 삭제">${I.close}</button>`);
      $('#ph').style.display = 'none';
      $('.rm', drop).onclick = (e) => { e.preventDefault(); clear(); refresh(); };
      refresh();
    }
    function clear() {
      $('img', drop)?.remove(); $('.rm', drop)?.remove();
      $('#ph').style.display = ''; chosenFile = null; preview = null; file.value = '';
    }
    file.addEventListener('change', () => setFile(file.files[0]));
    ['dragover', 'dragenter'].forEach((ev) => drop.addEventListener(ev, (e) => e.preventDefault()));
    drop.addEventListener('drop', (e) => { e.preventDefault(); setFile(e.dataTransfer.files[0]); });

    btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = '게시 중…';
      $('#e-form').textContent = '';
      const prog = $('#prog'), bar = $('i', prog);
      if (chosenFile) prog.style.display = 'block';
      try {
        await createPost({ caption: cap.value.trim() || null, file: chosenFile });
        bar.style.width = '100%';
        toast('게시글이 등록되었어요');
        location.href = 'index.html';
      } catch (err) {
        console.error(err);
        $('#e-form').textContent = '게시에 실패했어요. 다시 시도해주세요.';
        btn.disabled = false; btn.textContent = '게시';
        prog.style.display = 'none';
      }
    });
  </script>
</body>
</html>
